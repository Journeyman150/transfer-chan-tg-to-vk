telegram:
  bot_token: "dummy"
  channel_id: "@dummy"
  timeout: "30s"
  requests_per_second: 20
  max_retries: 3

vk:
  access_token: "dummy"
  group_id: 123456789
  timeout: "60s"
  post_delay: "3s"
  requests_per_second: 3.0
  max_retries: 3

transfer:
  dry_run: true
  include_text: true
  include_media: true
  skip_duplicates: true
  preserve_formatting: true
  add_source_link: true
  source_link_format: "Источник: %s"

media:
  temp_dir: "./temp"
  keep_files: false
  max_concurrent_downloads: 3
  max_concurrent_uploads: 2
  download_timeout: "30s"
  upload_timeout: "300s"

error_handling:
  retry:
    max_attempts: 3
    base_delay: "1s"
    max_delay: "30s"
    jitter: true
  circuit_breaker:
    reset_timeout: "60s"
  checkpoint:
    save_interval: "60s"